openapi: 3.2.0
info:
  title: Deeplead Contacts API
  version: 1.0.0
  description: Search local businesses, companies and people, and find decision makers with verified work emails and phone numbers. Authenticate with an API key as a Bearer token; up to 120 requests per minute per account, answered with 429 beyond that.
  contact:
    email: support@deeplead.io
    url: https://www.deeplead.io/developers
  termsOfService: https://www.deeplead.io/terms
servers:
- url: https://www.deeplead.io/api/v1
security:
- apiKey: []
tags:
- name: Contacts
paths:
  /contacts:
    post:
      operationId: contacts.create
      summary: Save your own contacts or organizations
      description: Free. Existing contacts are matched and kept, never duplicated.
      tags:
      - Contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contacts:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    properties:
                      email:
                        type: string
                        format: email
                      personName:
                        type: string
                      position:
                        type: string
                      businessName:
                        type: string
                      website:
                        type: string
                      linkedin:
                        type: string
                      phone:
                        type: string
                      city:
                        type: string
                      industry:
                        type: string
                      organizationId:
                        type: string
                        description: From /organizations/search
                  description: Contacts to save; each needs an email, LinkedIn URL, website or organization ID
              required:
              - contacts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: number
                required:
                - saved
    get:
      operationId: contacts.list
      summary: List your contacts in a stable order; page with nextBefore
      tags:
      - Contacts
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
          description: Maximum saved contacts to return on this page
        allowEmptyValue: true
        allowReserved: true
      - name: before
        in: query
        schema:
          type: string
          description: The nextBefore of the previous page
        allowEmptyValue: true
        allowReserved: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      type: object
                      properties:
                        contactId:
                          type: string
                        name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        email:
                          anyOf:
                          - type: string
                          - type: 'null'
                        jobTitle:
                          anyOf:
                          - type: string
                          - type: 'null'
                        companyName:
                          anyOf:
                          - type: string
                          - type: 'null'
                        website:
                          anyOf:
                          - type: string
                          - type: 'null'
                        linkedin:
                          anyOf:
                          - type: string
                          - type: 'null'
                        organizationId:
                          anyOf:
                          - type: string
                          - type: 'null'
                      required:
                      - contactId
                      - name
                      - email
                      - jobTitle
                      - companyName
                      - website
                      - linkedin
                      - organizationId
                  nextBefore:
                    anyOf:
                    - type: string
                    - type: 'null'
                required:
                - contacts
                - nextBefore
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
x-provenance:
  method: harvested
  publisher: Deeplead
  source: https://www.deeplead.io/api/v1/spec.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)

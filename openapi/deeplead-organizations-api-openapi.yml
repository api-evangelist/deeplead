  /organizations/{organizationId}/decision-maker:
    post:
      operationId: organizations.findDecisionMaker
      summary: Find the decision maker of an organization with a verified email
      description: Charges 2 credits only when a decision maker is found. Can take a few minutes. Send an Idempotency-Key header to make retries safe.
      tags:
      - Organizations
      parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          description: Company ID returned by organization search or enrichment
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: boolean
                  creditsCharged:
                    type: number
                  decisionMaker:
                    anyOf:
                    - type: object
                      properties:
                        name:
                          type: string
                        position:
                          anyOf:
                          - type: string
                          - type: 'null'
                        linkedin:
                          type: string
                        email:
                          type: string
                      required:
                      - name
                      - position
                      - linkedin
                      - email
                    - type: 'null'
                required:
                - found
                - creditsCharged
                - decisionMaker

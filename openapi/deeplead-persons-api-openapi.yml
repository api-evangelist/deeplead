                onePerOrganization:
                  type: boolean
                  default: true
              required:
              - count
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  chargedCredits:
                    type: number
                  contacts:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        email:
                          anyOf:
                          - type: string
                          - type: 'null'
                        phone:
                          anyOf:
                          - type: string
                          - type: 'null'
                        jobTitle:
                          anyOf:
                          - type: string
                          - type: 'null'

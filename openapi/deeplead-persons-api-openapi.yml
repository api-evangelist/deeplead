                      - name
                      - email
                      - phone
                      - jobTitle
                      - jobLevel
                      - city
                      - state
                      - companyName
                      - website
                      - linkedin
                      - organizationId
                required:
                - chargedCredits
                - contacts
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
